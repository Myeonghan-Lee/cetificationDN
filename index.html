<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>직무연수 이수증 다운로드</title>
  <style>
    body { font-family: "Pretendard", system-ui, sans-serif; background:#f5f6f8; margin:0; color:#111827; }
    /* 화면 크기 조정 */
    .wrap { width:50%; max-width:none; margin:6vh auto; background:#fff; border:1px solid #d1d5db;
            border-radius:12px; padding:32px; }
    h1 { font-size:32px; margin:0 0 12px; text-align:center;}
    p.sub { color:#6b7280; font-size:20px; margin:0 0 16px; text-align:center;}
    /* [기능1] 다운로드 가능 기간 안내 */
    .period { font-size:18px; color:#2563eb; font-weight:600; margin:0 0 24px; min-height:18px; text-align:center;}
    label { display:block; font-size:13px; font-weight:600; margin:16px 0 6px; }
    input { width:100%; box-sizing:border-box; padding:11px 12px; font-size:15px;
            border:1px solid #d1d5db; border-radius:8px; }
    button { width:100%; margin-top:24px; padding:13px; font-size:15px; font-weight:700;
             color:#fff; background:#2563eb; border:0; border-radius:8px; cursor:pointer; }
    button:disabled { background:#9ca3af; cursor:not-allowed; }
    .msg { margin-top:16px; font-size:14px; min-height:20px; }
    .msg.err { color:#dc2626; }
    .msg.ok  { color:#16a34a; }
    /* [기능2] 미리보기 영역 */
    #previewWrap { display:none; margin-top:24px; }
    #previewWrap h2 { font-size:14px; margin:0 0 8px; }
    #preview { width:100%; height:520px; border:1px solid #d1d5db; border-radius:8px; }
    .dl { display:inline-block; width:auto; margin-top:12px; padding:11px 20px;
          font-size:14px; font-weight:700; color:#fff; background:#16a34a;
          border-radius:8px; text-decoration:none; }
    /* [기능A · v3] 기간 종료 안내 문구 (평소 숨김) */
    #endedWrap { display:none; }
    #endedWrap .ended {
      font-size:16px; font-weight:700; line-height:1.6; color:#dc2626; text-align:center;
      padding:24px 8px;
    }
    /* 종료 화면에서는 기존 폼 영역을 숨긴다 */
    body.ended #formArea { display:none; }
    body.ended #endedWrap { display:block; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 평상시(다운로드 가능) 화면 -->
    <div id="formArea">
      <h1>직무연수 이수증 다운로드</h1>
      <p class="sub">이름과 생년월일을 입력하시면 본인의 이수증을 미리 보고 내려받을 수 있습니다.</p>
      <p class="period" id="period"></p>

      <label for="name">이름</label>
      <input id="name" type="text" placeholder="홍길동" autocomplete="off" />

      <label for="birth">생년월일</label>
      <!-- [기능3] date -> text: 숫자만 입력해도 자동으로 4-2-2 하이픈 삽입 -->
      <input id="birth" type="text" inputmode="numeric" maxlength="10"
             placeholder="YYYY-MM-DD (숫자만 입력)" autocomplete="off" />

      <!-- 캡차 사용 시 아래 주석 해제 + Turnstile 스크립트 로드 -->
      <!-- <div class="cf-turnstile" data-sitekey="YOUR_SITE_KEY" style="margin-top:16px;"></div> -->

      <button id="btn">이수증 조회</button>
      <div id="msg" class="msg"></div>

      <!-- [기능2] 조회 성공 시 표시되는 미리보기 + 다운로드 -->
      <div id="previewWrap">
        <h2>이수증 미리보기</h2>
        <iframe id="preview" title="이수증 미리보기"></iframe>
        <a id="dl" class="dl" download>PDF 다운로드</a>
      </div>
    </div>

    <!-- [기능A · v3] 기간 종료 시 이 문구만 표시 -->
    <div id="endedWrap">
      <p class="ended" id="endedText"></p>
    </div>
  </div>

  <!-- 캡차 사용 시: <script src="<https://challenges.cloudflare.com/turnstile/v0/api.js>" async defer></script> -->
  <script>
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    const birthInput = document.getElementById('birth');
    const previewWrap = document.getElementById('previewWrap');
    const preview = document.getElementById('preview');
    const dl = document.getElementById('dl');
    let lastURL = null; // 이전 미리보기 objectURL 정리용

    // [기능A·v3 + 기능1] 페이지 로드 시 상태/기간 조회
    //   status === 'ended' 이면 폼 전체를 감추고 안내 문구만 표시한다.
    fetch('/api/certificate')
      .then(r => r.json())
      .then(({ from, until, status, contact }) => {
        // ── [기능A] 기간 종료 처리 ──
        if (status === 'ended') {
          const phone = contact || '02-2600-0842';
          document.getElementById('endedText').textContent =
            `다운로드 기간이 종료되었습니다. 업무담당자(${phone})에게 연락주십시오!`;
          document.body.classList.add('ended'); // #formArea 숨김 + #endedWrap 표시
          return; // 이후 기간 표시 로직 불필요
        }

        // ── [기능1] 다운로드 가능 기간 표시 ──
        if (!from && !until) return;
        const f = s => s ? s.slice(0, 10).replace(/-/g, '.') : '';
        const el = document.getElementById('period');
        if (from && until) el.textContent = `다운로드 가능 기간: ${f(from)} ~ ${f(until)}`;
        else if (from)     el.textContent = `다운로드 시작일: ${f(from)}`;
        else               el.textContent = `다운로드 마감일: ${f(until)}`;
      })
      .catch(() => {});

    // [기능3] 생년월일 자동 하이픈 (4-2-2)
    birthInput.addEventListener('input', (e) => {
      const v = e.target.value.replace(/\D/g, '').slice(0, 8); // 숫자만 8자리
      let out = v;
      if (v.length > 6)      out = `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6)}`;
      else if (v.length > 4) out = `${v.slice(0,4)}-${v.slice(4)}`;
      e.target.value = out;
    });

    btn.addEventListener('click', async () => {
      const name  = document.getElementById('name').value.trim();
      const birth = birthInput.value; // YYYY-MM-DD
      msg.className = 'msg';
      msg.textContent = '';

      if (!name || !birth) {
        msg.className = 'msg err';
        msg.textContent = '이름과 생년월일을 모두 입력해 주세요.';
        return;
      }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(birth)) {
        msg.className = 'msg err';
        msg.textContent = '생년월일을 YYYYMMDD 8자리로 입력해 주세요.';
        return;
      }

      btn.disabled = true;
      previewWrap.style.display = 'none';
      msg.textContent = '조회 중입니다...';

      try {
        // 캡차 사용 시: const token = document.querySelector('[name=cf-turnstile-response]')?.value;
        const res = await fetch('/api/certificate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, birthdate: birth /*, token */ })
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          msg.className = 'msg err';
          msg.textContent = data.error || '조회에 실패했습니다.';
          btn.disabled = false;
          return;
        }

        // [기능2] PDF blob 수신 → 미리보기 + 다운로드 링크 연결
        const blob = await res.blob();
        if (lastURL) URL.revokeObjectURL(lastURL);
        lastURL = URL.createObjectURL(blob);

        preview.src = lastURL;                       // iframe 미리보기
        dl.href = lastURL;                           // 다운로드 버튼
        dl.download = `${name}_직무연수이수증.pdf`;
        previewWrap.style.display = 'block';

        msg.className = 'msg ok';
        msg.textContent = '조회 완료. 아래에서 미리 보고 다운로드하세요.';
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = '네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
